# ---------------------------------------------------------------------------
# Loan Management System - default configuration
#
# To override without editing this file, create a config.properties next to
# the jar (same keys), or pass JVM flags:  java -Ddb.password=secret -jar ...
# ---------------------------------------------------------------------------

# MySQL connection. The database is created automatically on first run.
db.url=jdbc:mysql://localhost:3306/loan_management?createDatabaseIfNotExist=true&serverTimezone=UTC
db.user=root
db.password=12345

# Built-in administrator, created on first start if no admin exists.
admin.username=admin
admin.password=Admin@123

# Account is locked (status INACTIVE) after this many consecutive wrong passwords.
security.max-failed-attempts=3
